name: tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: BytesUtils
            module: tajo-common
            tests: 'BytesUtils*'
          - name: StorageUtil
            module: tajo-storage/tajo-storage-common
            tests: 'StorageUtil*'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build modules
        run: mvn -B -ntp -pl ${{ matrix.module }} -am install -DskipTests -Drat.skip=true

        
      - name: Run Tests
        run: >
          mvn -B -ntp -pl ${{ matrix.module }} test
          -Dtest='${{ matrix.tests }}' -DfailIfNoTests=false
          -Dtest.failure.ignore=false

      - name: Save Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.name }}
          path: |
            ${{ matrix.module }}/target/surefire-reports/
            ${{ matrix.module }}/target/site/jacoco/
            ${{ matrix.module }}/target/pit-reports/
          if-no-files-found: ignore

